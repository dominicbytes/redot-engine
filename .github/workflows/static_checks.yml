name: 📊 Static Checks
on:
  workflow_call:
    inputs:
      all_files:
        description: Run every automatic hook on all tracked files
        type: boolean
        default: false

jobs:
  static-checks:
    name: Code style, file formatting, and docs
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # This needs to happen before Python and npm execution; it must happen before any extra files are written.
      - name: .gitignore checks (gitignore_check.sh)
        run: |
          bash ./misc/scripts/gitignore_check.sh

      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"

      - name: Cache pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-pc4.6.2-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Test .NET formatting helper
        run: python tests/python_build/test_dotnet_format.py

      - name: Test lint scope selection
        run: python tests/python_build/test_ci_lint.py

      - name: Style checks via pre-commit
        id: lint
        env:
          LINT_ALL_FILES: ${{ inputs.all_files }}
        run: python misc/scripts/ci_lint.py

      - name: Class reference schema checks
        run: |
          sudo apt-get update
          sudo apt-get install libxml2-utils
          xmllint --quiet --noout --schema doc/class.xsd doc/classes/*.xml modules/*/doc_classes/*.xml platform/*/doc_classes/*.xml

      - name: Run C compiler on `gdextension_interface.h`
        run: |
          gcc -c core/extension/gdextension_interface.h

      - name: Save full-tree lint diagnostics
        if: failure() && inputs.all_files && steps.lint.outcome == 'failure'
        run: |
          git diff --binary > "$RUNNER_TEMP/lint-diff.patch"
          git status --short > "$RUNNER_TEMP/lint-status.txt"

      - name: Upload full-tree lint diagnostics
        if: failure() && inputs.all_files && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-tree-lint-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lint-diff.patch
            ${{ runner.temp }}/lint-status.txt
          retention-days: 14
